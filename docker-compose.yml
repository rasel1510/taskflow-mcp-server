services:
  taskflow-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-mcp-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
